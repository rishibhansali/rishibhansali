<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="260" fill="#0a0a0a"/>

  <!-- corner brackets, terminal-window nod -->
  <path d="M32 32 H64 M32 32 V64" stroke="#3f3f46" stroke-width="1.5"/>
  <path d="M1168 32 H1136 M1168 32 V64" stroke="#3f3f46" stroke-width="1.5"/>
  <path d="M32 228 H64 M32 228 V196" stroke="#3f3f46" stroke-width="1.5"/>
  <path d="M1168 228 H1136 M1168 228 V196" stroke="#3f3f46" stroke-width="1.5"/>

  <!-- name -->
  <text x="64" y="122" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="44" letter-spacing="2" fill="#f5f5f5">
    rishi<tspan fill="#4ade80">.</tspan>bhansali
  </text>

  <!-- blinking cursor -->
  <rect x="472" y="90" width="12" height="38" fill="#4ade80">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.6s" repeatCount="indefinite"/>
  </rect>

  <!-- tagline -->
  <text x="65" y="158" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#a1a1aa" letter-spacing="0.5">
    software engineer — backend systems, sometimes with a language model attached
  </text>

  <!-- animated draw-in accent line -->
  <line x1="64" y1="182" x2="1136" y2="182" stroke="#27272a" stroke-width="1"/>
  <line x1="64" y1="182" x2="1136" y2="182" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="1072" stroke-dashoffset="1072">
    <animate attributeName="stroke-dashoffset" from="1072" to="0" dur="1.8s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </line>
</svg>
